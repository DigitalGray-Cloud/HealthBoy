<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthBoy</title>
    <style>
      :root {
        color: #0f1720;
        background: #f5f6f8;
        font: 18px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f6f8;
      }

      .fallback {
        max-width: 760px;
        margin: 48px auto;
        padding: 32px;
        border: 1px solid #d8deea;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 32, 0.08);
      }

      .fallback p {
        margin: 0 0 12px;
        color: #5b6577;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .fallback h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .fallback strong {
        display: block;
        margin-top: 16px;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="fallback">
        <p>Cloudflare Pages Ready</p>
        <h1>HealthBoy</h1>
        <strong>If JavaScript fails, this fallback content should still be visible.</strong>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
