<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthBoy</title>
    <style>
      :root {
        color: #0f1720;
        background: #f5f6f8;
        font: 18px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f6f8;
      }
      main {
        max-width: 760px;
        margin: 48px auto;
        padding: 32px;
        border: 1px solid #d8deea;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 32, 0.08);
      }
      p {
        margin: 0 0 12px;
        color: #5b6577;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      .lead {
        margin-top: 16px;
        color: #1e2430;
        font-size: 20px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0;
      }
      ul {
        margin: 24px 0 0;
        padding-left: 20px;
        color: #1e2430;
      }
      li + li {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main>
        <p>Cloudflare Pages Ready</p>
        <h1>HealthBoy</h1>
        <p class="lead">HealthBoy 페이지가 정상적으로 배포되었습니다.</p>
        <ul>
          <li>Project: healthboy</li>
          <li>Build: npm run build</li>
          <li>Output: dist</li>
        </ul>
      </main>
    </div>
  </body>
</html>
